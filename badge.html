    <style>

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .main-nav .nav-desktop {
            display: flex !important;
            align-items: center;
            gap: 22px;
        }

        .main-nav .nav-mobile {
            display: none !important;
        }

        .main-nav .nav-mobile summary {
            display: none !important;
        }

        @media (max-width: 800px) {

            .main-nav .nav-desktop {
                display: none !important;
            }

            .main-nav .nav-mobile {
                display: flex !important;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                position: relative;
                white-space: nowrap;
            }

            .main-nav .nav-mobile > a {
                display: block !important;
                padding: 8px 4px;
                color: #fff;
                text-decoration: none;
                font-size: 14px;
                font-weight: bold;
                white-space: nowrap;
            }

            .main-nav .nav-mobile > a:hover,
            .main-nav .nav-mobile > a.active {
                color: var(--bleu-discredit);
            }

            .main-nav .nav-mobile .nav-more {
                position: relative;
            }

            .main-nav .nav-mobile summary {
                display: block !important;
                list-style: none;
                cursor: pointer;
                color: #fff;
                padding: 8px 4px;
                font-size: 14px;
                font-weight: bold;
                white-space: nowrap;
            }

            .main-nav .nav-mobile summary::-webkit-details-marker {
                display: none;
            }

            .main-nav .nav-mobile summary::after {
                content: "⌄";
                display: inline-block;
                margin-left: 5px;
                font-size: 13px;
                line-height: 1;
                transform: translateY(-1px);
            }

            .main-nav .nav-mobile .nav-more[open] summary::after {
                transform: translateY(1px);
            }

            .main-nav .nav-mobile summary:hover {
                color: var(--bleu-discredit);
            }

            .main-nav .nav-mobile .nav-more-menu {
                position: absolute;
                top: calc(100% + 10px);
                right: 0;
                z-index: 200;
                display: flex !important;
                flex-direction: column;
                gap: 0;
                min-width: 170px;
                padding: 8px 0;
                background: var(--noir);
                border: 1px solid #333;
                border-radius: 8px;
                box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.35);
            }

            .main-nav .nav-mobile .nav-more-menu a {
                display: block !important;
                padding: 10px 14px;
                color: #fff;
                text-decoration: none;
                font-size: 14px;
                font-weight: bold;
                white-space: nowrap;
            }

            .main-nav .nav-mobile .nav-more-menu a:hover,
            .main-nav .nav-mobile .nav-more-menu a.active {
                background: #222;
                color: var(--bleu-discredit);
            }

        }


        /* =====================================================
           STATUT SUR LA PHOTO
        ===================================================== */

        .badge-candidates .candidate-photo {
            position: relative;
        }

        .badge-candidates .candidate-photo .candidate-status {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 60px;
            height: 60px;
            max-width: none;
            object-fit: contain;
            z-index: 5;
            margin: 0;
        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a href="/" class="logo">
            DISCRÉDIT <span>125</span>

        <nav class="main-nav">

            <!-- DESKTOP -->

            <div class="nav-desktop">

                <a href="/">
                    Accueil
                </a>

                <a href="/personnes.html">
                    Candidats
                </a>

                <a href="/badges.html" class="active">
                    Badges
                </a>

                <a href="/statuts.html">
                    Statuts
                </a>

                <a href="/trophees.html">
                    Trophées
                </a>

                <a href="/soumettre.html">
                    Soumettre
                </a>

                <a href="/erreur.html">
                    Signaler

                    À propos
                </a>

            </div>


            <!-- MOBILE -->

            <div class="nav-mobile">

                <a href="/">
                    Accueil
                </a>

                <a href="/personnes.html">
                    Candidats
                </a>

                <a href="/badges.html" class="active">
                    Badges
                </a>

                <details class="nav-more">

                    <summary>
                        Plus
                    </summary>

                    <div class="nav-more-menu">

                        <a href="/statuts.html">
                            Statuts
                        </a>

                        <a href="/trophees.html">
                            Trophées
                        </a>

                        <a href="/soumettre.html">
                            Soumettre
                        </a>

                        <a href="/erreur.html">
                            Signaler

                        <a href="/a-propos.html">
                            À propos
                        </a>

                    </div>

                </details>

            </div>

        </nav>

<script>

/* ============================================================
   MASQUER LA NAVIGATION DANS UNE FENÊTRE / IFRAME
   ============================================================ */

if (window.self !== window.top) {

    const header =
        document.querySelector(
            ".site-header"
        );

    if (header) {

        header.style.display =
            "none";

    }

}

</script>


<main class="container">

    <div id="badge-container"></div>


    <section
        id="candidats-section"
        class="candidate-section"
        style="display: none;"
    >

        <h2 class="section-title">
            Candidats associés
        </h2>


        <div
            id="candidats-container"
            class="badge-candidates"
        ></div>

    </section>

</main>



<script>


/* ============================================================
   PARSEUR CSV
   ============================================================ */

function parserCSV(texte) {

    texte = texte
        .replace(/^\uFEFF/, "")
        .trim();


    if (!texte) {
        return [];
    }


    const lignes =
        texte.split(/\r?\n/);


    const entetes =
        lignes[0]
            .split(";")
            .map(
                entete =>
                    entete.trim()
            );


    return lignes
        .slice(1)
        .filter(
            ligne =>
                ligne.trim() !== ""
        )
        .map(
            ligne => {

                const valeurs =
                    ligne.split(";");


                const objet = {};


                entetes.forEach(
                    (
                        entete,
                        index
                    ) => {

                        objet[entete] =
                            (
                                valeurs[index] ||
                                ""
                            ).trim();

                    }
                );


                return objet;

            }
        );

}



/* ============================================================
   CHARGEMENT CSV
   ============================================================ */

async function chargerCSV(url) {

    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Impossible de charger " +
            url
        );

    }


    return parserCSV(
        await response.text()
    );

}



/* ============================================================
   NORMALISATION DU STATUT
   ============================================================ */

function normaliserStatut(statut) {

    return String(
        statut || ""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .trim()
        .toUpperCase();

}



/* ============================================================
   CARTE CANDIDAT
   ============================================================ */

function creerCarteCandidat(
    candidat,
    nombreBadges
) {

    const carte =
        document.createElement(
            "a"
        );


    carte.className =
        "candidate-card";


    /*
     * Page individuelle du candidat.
     */

    carte.href =
        "/individus.html#" +
        encodeURIComponent(
            candidat.personne_id
        );



    /* ========================================================
       PHOTO
       ======================================================== */

    const photo =
        document.createElement(
            "div"
        );


    photo.className =
        "candidate-photo";


    const image =
        document.createElement(
            "img"
        );


    image.src =
        "/images/personnes/" +
        encodeURIComponent(
            candidat.personne_id
        ) +
        ".webp";


    image.alt =
        candidat.nom;


    image.loading =
        "lazy";


    photo.appendChild(
        image
    );



    /* ========================================================
       STATUT
       ======================================================== */

    const statut =
        normaliserStatut(
            candidat.statut
        );


    let imageStatut = "";


    if (
        statut.includes("GAME OVER")
    ) {

        imageStatut =
            "/images/statuts/GAME_OVER.webp";

    }

    else if (
        statut === "RADIOACTIF"
    ) {

        imageStatut =
            "/images/statuts/RADIOACTIF.webp";

    }


    if (imageStatut) {

        const statutImage =
            document.createElement(
                "img"
            );


        statutImage.className =
            "candidate-status";


        statutImage.src =
            imageStatut;


        statutImage.alt =
            candidat.statut;


        photo.appendChild(
            statutImage
        );

    }



    /* ========================================================
       INFORMATIONS
       ======================================================== */

    const informations =
        document.createElement(
            "div"
        );


    informations.className =
        "candidate-info";



    /* NOM */

    const nom =
        document.createElement(
            "h3"
        );


    nom.className =
        "candidate-name";


    nom.textContent =
        candidat.nom;



    /* PARTI */

    const parti =
        document.createElement(
            "div"
        );


    parti.className =
        "candidate-party";


    parti.textContent =
        candidat.parti;



    /* CIRCONSCRIPTION */

    const circonscription =
        document.createElement(
            "div"
        );


    circonscription.className =
        "candidate-riding";


    circonscription.textContent =
        candidat.circonscription;



    /* NOMBRE DE BADGES */

    const nombreBadgesElement =
        document.createElement(
            "div"
        );


    nombreBadgesElement.className =
        "candidate-badge-count";


    nombreBadgesElement.textContent =
        nombreBadges +
        (
            nombreBadges === 1
                ? " badge"
                : " badges"
        );



    informations.appendChild(
        nom
    );


    informations.appendChild(
        parti
    );


    informations.appendChild(
        circonscription
    );


    informations.appendChild(
        nombreBadgesElement
    );



    carte.appendChild(
        photo
    );


    carte.appendChild(
        informations
    );


    return carte;

}



/* ============================================================
   AFFICHER ERREUR
   ============================================================ */

function afficherErreur(message) {

    const conteneur =
        document.getElementById(
            "badge-container"
        );


    conteneur.innerHTML =
        "";


    const bloc =
        document.createElement(
            "div"
        );


    bloc.className =
        "message message-error";


    bloc.textContent =
        message;


    conteneur.appendChild(
        bloc
    );

}



/* ============================================================
   CHARGER LE BADGE
   ============================================================ */

async function chargerBadge() {

    const parametres =
        new URLSearchParams(
            window.location.search
        );


    const badgeId =
        parametres.get("id");


    if (!badgeId) {

        afficherErreur(
            "Aucun badge n'a été spécifié."
        );


        return;

    }



    try {

        const [
            badges,
            personnes,
            attributions,
            attributionsSources
        ] = await Promise.all([

            chargerCSV(
                "/data/badges.csv"
            ),

            chargerCSV(
                "/data/personnes.csv"
            ),

            chargerCSV(
                "/data/attributions.csv"
            ),

            chargerCSV(
                "/data/attributions_sources.csv"
            )

        ]);



        /* ====================================================
           TROUVER LE BADGE
        ==================================================== */

        const badge =
            badges.find(
                item =>
                    item.id ===
                    badgeId
            );


        if (!badge) {

            afficherErreur(
                "Badge introuvable."
            );


            return;

        }



        document.title =
            badge.nom +
            " — Discrédit 125";



        /* ====================================================
           CONTENEUR
        ==================================================== */

        const badgeContainer =
            document.getElementById(
                "badge-container"
            );


        badgeContainer.innerHTML =
            "";



        /* ====================================================
           DÉTAIL DU BADGE
        ==================================================== */

        const detail =
            document.createElement(
                "div"
            );


        detail.className =
            "badge-detail";



        /* IMAGE */

        const imageContainer =
            document.createElement(
                "div"
            );


        imageContainer.className =
            "badge-detail-image";



        const image =
            document.createElement(
                "img"
            );


        image.src =
            "/images/badges/" +
            encodeURIComponent(
                badge.image
            );


        image.alt =
            badge.nom;


        image.loading =
            "eager";



        imageContainer.appendChild(
            image
        );



        /* INFORMATIONS */

        const informations =
            document.createElement(
                "div"
            );


        informations.className =
            "badge-detail-info";



        /* TITRE */

        const titre =
            document.createElement(
                "h1"
            );


        titre.textContent =
            badge.nom;



        /* CATÉGORIE */

        const categorie =
            document.createElement(
                "div"
            );


        categorie.className =
            "badge-detail-category";


        categorie.textContent =
            badge.categorie;



        /* DESCRIPTION */

        const description =
            document.createElement(
                "p"
            );


        description.className =
            "badge-detail-description";


        description.textContent =
            badge.description;



        informations.appendChild(
            titre
        );


        informations.appendChild(
            categorie
        );


        informations.appendChild(
            description
        );



        detail.appendChild(
            imageContainer
        );


        detail.appendChild(
            informations
        );



        badgeContainer.appendChild(
            detail
        );



        /* ====================================================
           CANDIDATS ASSOCIÉS
        ==================================================== */

        let candidatsAssocies =
            attributions

                .filter(
                    attribution =>
                        attribution.badge_id ===
                        badge.id
                )

                .map(
                    attribution =>
                        personnes.find(
                            personne =>
                                personne.personne_id ===
                                attribution.personne_id
                        )
                )

                .filter(
                    personne =>
                        personne
                )

                /* DÉDUPLICATION DES CANDIDATS */

                .filter(
                    (
                        personne,
                        index,
                        tableau
                    ) =>
                        index ===
                        tableau.findIndex(
                            autre =>
                                autre.personne_id ===
                                personne.personne_id
                        )
                );



        /* ====================================================
           GRAND CHAMPION INTERNATIONNAL DE COURSE
        ==================================================== */

        if (
            badge.nom.trim() ===
            "Grand champion internationnal de course"
        ) {

            const nombreSourcesParCandidat =
                new Map();


            candidatsAssocies.forEach(
                candidat => {

                    const sources =
                        new Set();


                    attributionsSources.forEach(
                        attributionSource => {

                            if (
                                attributionSource.personne_id ===
                                    candidat.personne_id &&
                                attributionSource.badge_id ===
                                    badge.id &&
                                attributionSource.source_id
                            ) {

                                sources.add(
                                    attributionSource.source_id
                                );

                            }

                        }
                    );


                    nombreSourcesParCandidat.set(
                        candidat.personne_id,
                        sources.size
                    );

                }
            );



            let maximumSources = 0;


            nombreSourcesParCandidat.forEach(
                nombreSources => {

                    if (
                        nombreSources >
                        maximumSources
                    ) {

                        maximumSources =
                            nombreSources;

                    }

                }
            );


            candidatsAssocies =
                candidatsAssocies.filter(
                    candidat =>
                        nombreSourcesParCandidat.get(
                            candidat.personne_id
                        ) ===
                        maximumSources
                );

        }



        const section =
            document.getElementById(
                "candidats-section"
            );


        const candidatsContainer =
            document.getElementById(
                "candidats-container"
            );



        if (
            candidatsAssocies.length > 0
        ) {

            section.style.display =
                "block";


            candidatsContainer.innerHTML =
                "";


            candidatsAssocies.forEach(
                personne => {

                    /*
                     * Un badge ne compte qu'une seule fois
                     * par candidat, même s'il apparaît dans
                     * plusieurs lignes d'attributions.
                     *
                     * Le décompte ne repose pas sur les sources.
                     */

                    const badgeIds =
                        new Set();

                    attributions.forEach(
                        attribution => {

                            if (
                                attribution.personne_id ===
                                    personne.personne_id &&
                                attribution.badge_id
                            ) {

                                badgeIds.add(
                                    attribution.badge_id
                                );

                            }

                        }
                    );


                    const nombreBadges =
                        badgeIds.size;


                    candidatsContainer.appendChild(

                        creerCarteCandidat(
                            personne,
                            nombreBadges
                        )

                    );

                }
            );

        }

    }

    catch (erreur) {

        console.error(
            erreur
        );


        afficherErreur(
            "Impossible de charger les données du badge."
        );

    }

}



/* ============================================================
   DÉMARRAGE
============================================================ */

chargerBadge();


</script>


</body>
